# CI/CD de GESCOM
#  - En cada push y PR a main: tests del backend (pytest) y build del frontend.
#  - En cada push a main (si los tests pasan): imagen del backend a GHCR,
#    deploy a Azure Container Apps y deploy del frontend como sitio estático en Azure Storage.
# Configuración (secrets y variables del repo): ver DEPLOY-AZURE.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; si llegan dos pushes seguidos, el segundo espera.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gescom-api

jobs:
  test-backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gescom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gescom_test
        run: pytest -q

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Build (Vite)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-backend:
    name: Deploy backend (Container Apps)
    needs: [test-backend, build-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publicar la imagen en GHCR
      id-token: write # login a Azure por OIDC (sin contraseñas guardadas)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mientras la Container App no exista (primer deploy, ver DEPLOY-AZURE.md)
      # la variable AZURE_CONTAINERAPP queda vacía y solo se publica la imagen.
      - name: Login a Azure
        if: vars.AZURE_CONTAINERAPP != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar la Container App
        if: vars.AZURE_CONTAINERAPP != ''
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --only-show-errors -o none
      - name: Health check
        if: vars.AZURE_CONTAINERAPP != ''
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/health"; then echo; echo "Backend OK"; exit 0; fi
            echo "Esperando al backend ($i/30)..."; sleep 10
          done
          echo "El backend no respondió /health en 5 minutos" >&2
          exit 1

  deploy-frontend:
    name: Deploy frontend (Azure Storage, sitio estático)
    # Después del backend: el frontend nuevo nunca llega antes que la API que usa.
    needs: [deploy-backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VITE_API_URL != '' && vars.AZURE_WEB_STORAGE != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Subir al contenedor $web
        env:
          WEB: ${{ vars.AZURE_WEB_STORAGE }}
        run: |
          # 1) Assets con hash en el nombre: cache largo (nunca cambian).
          if [ -d dist/assets ]; then
            az storage blob upload-batch --account-name "$WEB" --auth-mode key \
              --destination '$web' --destination-path assets --source dist/assets --overwrite \
              --content-cache-control "public, max-age=31536000, immutable" --only-show-errors -o none
          fi
          # 2) Archivos de la raíz (index.html, íconos) al final y sin cache:
          #    el index nuevo se publica cuando sus assets ya están arriba.
          for f in dist/*; do
            [ -f "$f" ] || continue
            az storage blob upload --account-name "$WEB" --auth-mode key \
              --container-name '$web' --name "$(basename "$f")" --file "$f" --overwrite \
              --content-cache-control "no-cache" --only-show-errors -o none
          done
          echo "Frontend publicado en $(az storage account show -n "$WEB" --query primaryEndpoints.web -o tsv)"
